<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Bootstrap Button Group Demo</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

    <div class="container mt-4">

        <h2>Bootstrap Button Groups</h2>

        <!-- Basic Button Group -->
        <h4 class="mt-4">Basic Button Group</h4>

        <div class="btn-group" role="group">

            <button type="button" class="btn btn-primary">
                Home
            </button>

            <button type="button" class="btn btn-primary">
                About
            </button>

            <button type="button" class="btn btn-primary">
                Contact
            </button>

        </div>


        <!-- Different Button Colors -->
        <h4 class="mt-4">Different Button Colors</h4>

        <div class="btn-group" role="group">

            <button type="button" class="btn btn-success">
                Add
            </button>

            <button type="button" class="btn btn-warning">
                Edit
            </button>

            <button type="button" class="btn btn-danger">
                Delete
            </button>

        </div>


        <!-- Outline Button Group -->
        <h4 class="mt-4">Outline Button Group</h4>

        <div class="btn-group" role="group">

            <button type="button" class="btn btn-outline-primary">
                HTML
            </button>

            <button type="button" class="btn btn-outline-primary">
                CSS
            </button>

            <button type="button" class="btn btn-outline-primary">
                JavaScript
            </button>

        </div>


        <!-- Vertical Button Group -->
        <h4 class="mt-4">Vertical Button Group</h4>

        <div class="btn-group-vertical" role="group">

            <button type="button" class="btn btn-primary">
                First
            </button>

            <button type="button" class="btn btn-primary">
                Second
            </button>

            <button type="button" class="btn btn-primary">
                Third
            </button>

        </div>

    </div>

</body>

</html>
