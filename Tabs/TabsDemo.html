<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Bootstrap Tabs Demo</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

    <div class="container mt-4">

        <h2>Bootstrap Tabs</h2>


        <!-- Tabs Navigation -->
        <ul class="nav nav-tabs"
            id="myTabs"
            role="tablist">

            <li class="nav-item"
                role="presentation">

                <button class="nav-link active"
                        id="home-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#home"
                        type="button"
                        role="tab">

                    Home

                </button>

            </li>


            <li class="nav-item"
                role="presentation">

                <button class="nav-link"
                        id="profile-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#profile"
                        type="button"
                        role="tab">

                    Profile

                </button>

            </li>


            <li class="nav-item"
                role="presentation">

                <button class="nav-link"
                        id="contact-tab"
                        data-bs-toggle="tab"
                        data-bs-target="#contact"
                        type="button"
                        role="tab">

                    Contact

                </button>

            </li>

        </ul>


        <!-- Tab Content -->
        <div class="tab-content"
             id="myTabsContent">


            <!-- Home Tab -->
            <div class="tab-pane fade show active"
                 id="home"
                 role="tabpanel">

                <div class="p-4 border border-top-0">

                    <h4>Home</h4>

                    <p>
                        Welcome to the Home tab.
                    </p>

                </div>

            </div>


            <!-- Profile Tab -->
            <div class="tab-pane fade"
                 id="profile"
                 role="tabpanel">

                <div class="p-4 border border-top-0">

                    <h4>Profile</h4>

                    <p>
                        This is the Profile tab.
                    </p>

                </div>

            </div>


            <!-- Contact Tab -->
            <div class="tab-pane fade"
                 id="contact"
                 role="tabpanel">

                <div class="p-4 border border-top-0">

                    <h4>Contact</h4>

                    <p>
                        This is the Contact tab.
                    </p>

                </div>

            </div>

        </div>


        <!-- Pills -->
        <h2 class="mt-5">
            Bootstrap Pills
        </h2>

        <ul class="nav nav-pills">

            <li class="nav-item">

                <a class="nav-link active"
                   href="#">
                    Home
                </a>

            </li>

            <li class="nav-item">

                <a class="nav-link"
                   href="#">
                    Products
                </a>

            </li>

            <li class="nav-item">

                <a class="nav-link"
                   href="#">
                    Services
                </a>

            </li>

        </ul>

    </div>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
