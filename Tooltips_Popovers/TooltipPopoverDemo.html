<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Bootstrap Tooltips and Popovers</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

    <div class="container mt-4">

        <h2>Bootstrap Tooltips</h2>

        <!-- Basic Tooltip -->
        <button type="button"
                class="btn btn-primary"
                data-bs-toggle="tooltip"
                data-bs-placement="top"
                title="This is a tooltip">

            Hover Over Me

        </button>


        <!-- Tooltip Bottom -->
        <button type="button"
                class="btn btn-success ms-2"
                data-bs-toggle="tooltip"
                data-bs-placement="bottom"
                title="Tooltip appears at the bottom">

            Bottom Tooltip

        </button>


        <!-- Tooltip Right -->
        <button type="button"
                class="btn btn-warning ms-2"
                data-bs-toggle="tooltip"
                data-bs-placement="right"
                title="Tooltip appears on the right">

            Right Tooltip

        </button>


        <!-- Popovers -->
        <h2 class="mt-5">
            Bootstrap Popovers
        </h2>

        <!-- Basic Popover -->
        <button type="button"
                class="btn btn-danger"
                data-bs-toggle="popover"
                data-bs-title="Popover Title"
                data-bs-content="This is the content displayed inside the popover.">

            Click Me

        </button>


        <!-- Popover Right -->
        <button type="button"
                class="btn btn-info ms-2"
                data-bs-toggle="popover"
                data-bs-placement="right"
                data-bs-title="Information"
                data-bs-content="This popover appears on the right side.">

            Show Information

        </button>


        <!-- Popover Bottom -->
        <button type="button"
                class="btn btn-secondary ms-2"
                data-bs-toggle="popover"
                data-bs-placement="bottom"
                data-bs-title="More Details"
                data-bs-content="Additional information can be displayed here.">

            More Details

        </button>

    </div>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Initialize Bootstrap Components -->
    <script>

        // Initialize all tooltips
        const tooltipTriggerList =
            document.querySelectorAll('[data-bs-toggle="tooltip"]');

        const tooltipList =
            [...tooltipTriggerList].map(
                tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl)
            );


        // Initialize all popovers
        const popoverTriggerList =
            document.querySelectorAll('[data-bs-toggle="popover"]');

        const popoverList =
            [...popoverTriggerList].map(
                popoverTriggerEl => new bootstrap.Popover(popoverTriggerEl)
            );

    </script>

</body>

</html>
