<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Bootstrap Spinners and Progress Bars</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

    <div class="container mt-4">

        <h2>Bootstrap Spinners</h2>


        <!-- Basic Spinner -->
        <h4 class="mt-4">Basic Spinner</h4>

        <div class="spinner-border"
             role="status">

            <span class="visually-hidden">
                Loading...
            </span>

        </div>


        <!-- Colored Spinner -->
        <h4 class="mt-4">Colored Spinners</h4>

        <div class="spinner-border text-primary"
             role="status">
        </div>

        <div class="spinner-border text-success ms-2"
             role="status">
        </div>

        <div class="spinner-border text-danger ms-2"
             role="status">
        </div>

        <div class="spinner-border text-warning ms-2"
             role="status">
        </div>


        <!-- Growing Spinner -->
        <h4 class="mt-4">Growing Spinner</h4>

        <div class="spinner-grow text-primary"
             role="status">

            <span class="visually-hidden">
                Loading...
            </span>

        </div>


        <!-- Spinner Inside Button -->
        <h4 class="mt-4">Spinner Inside Button</h4>

        <button type="button"
                class="btn btn-primary"
                disabled>

            <span class="spinner-border spinner-border-sm"
                  aria-hidden="true">
            </span>

            <span role="status">
                Loading...
            </span>

        </button>


        <!-- Progress Bars -->
        <h2 class="mt-5">
            Bootstrap Progress Bars
        </h2>


        <!-- Basic Progress Bar -->
        <h4 class="mt-4">
            25% Progress
        </h4>

        <div class="progress">

            <div class="progress-bar"
                 role="progressbar"
                 style="width: 25%;"
                 aria-valuenow="25"
                 aria-valuemin="0"
                 aria-valuemax="100">

                25%

            </div>

        </div>


        <!-- 50% Progress -->
        <h4 class="mt-4">
            50% Progress
        </h4>

        <div class="progress">

            <div class="progress-bar bg-success"
                 role="progressbar"
                 style="width: 50%;"
                 aria-valuenow="50"
                 aria-valuemin="0"
                 aria-valuemax="100">

                50%

            </div>

        </div>


        <!-- 75% Progress -->
        <h4 class="mt-4">
            75% Progress
        </h4>

        <div class="progress">

            <div class="progress-bar bg-warning"
                 role="progressbar"
                 style="width: 75%;"
                 aria-valuenow="75"
                 aria-valuemin="0"
                 aria-valuemax="100">

                75%

            </div>

        </div>


        <!-- Striped Progress -->
        <h4 class="mt-4">
            Striped Progress
        </h4>

        <div class="progress">

            <div class="progress-bar progress-bar-striped"
                 role="progressbar"
                 style="width: 60%;"
                 aria-valuenow="60"
                 aria-valuemin="0"
                 aria-valuemax="100">

                60%

            </div>

        </div>


        <!-- Animated Progress -->
        <h4 class="mt-4">
            Animated Progress
        </h4>

        <div class="progress">

            <div class="progress-bar progress-bar-striped progress-bar-animated"
                 role="progressbar"
                 style="width: 80%;"
                 aria-valuenow="80"
                 aria-valuemin="0"
                 aria-valuemax="100">

                80%

            </div>

        </div>


        <!-- Multiple Progress Bars -->
        <h4 class="mt-4">
            Multiple Progress Bars
        </h4>

        <div class="progress">

            <div class="progress-bar bg-success"
                 style="width: 40%;">

                40%

            </div>

            <div class="progress-bar bg-warning"
                 style="width: 30%;">

                30%

            </div>

            <div class="progress-bar bg-danger"
                 style="width: 20%;">

                20%

            </div>

        </div>

    </div>

</body>

</html>
