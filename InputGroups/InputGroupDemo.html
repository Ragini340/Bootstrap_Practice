<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Bootstrap Input Group Demo</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

    <div class="container mt-4">

        <h2>Bootstrap Input Groups</h2>


        <!-- Text Before Input -->
        <h4 class="mt-4">Input With Text Before</h4>

        <div class="input-group mb-3">

            <span class="input-group-text">
                @
            </span>

            <input type="text"
                   class="form-control"
                   placeholder="Username">

        </div>


        <!-- Text After Input -->
        <h4 class="mt-4">Input With Text After</h4>

        <div class="input-group mb-3">

            <input type="text"
                   class="form-control"
                   placeholder="Enter amount">

            <span class="input-group-text">
                ₹
            </span>

        </div>


        <!-- Text Before and After -->
        <h4 class="mt-4">Input With Text Before and After</h4>

        <div class="input-group mb-3">

            <span class="input-group-text">
                ₹
            </span>

            <input type="number"
                   class="form-control"
                   placeholder="Amount">

            <span class="input-group-text">
                .00
            </span>

        </div>


        <!-- Input Group With Button -->
        <h4 class="mt-4">Input Group With Button</h4>

        <div class="input-group mb-3">

            <input type="text"
                   class="form-control"
                   placeholder="Search">

            <button type="button"
                    class="btn btn-primary">
                Search
            </button>

        </div>


        <!-- Email Input Group -->
        <h4 class="mt-4">Email Input Group</h4>

        <div class="input-group mb-3">

            <span class="input-group-text">
                Email
            </span>

            <input type="email"
                   class="form-control"
                   placeholder="example@gmail.com">

        </div>


        <!-- Input Group Size -->
        <h4 class="mt-4">Large Input Group</h4>

        <div class="input-group input-group-lg mb-3">

            <span class="input-group-text">
                Name
            </span>

            <input type="text"
                   class="form-control"
                   placeholder="Enter your name">

        </div>


        <h4 class="mt-4">Small Input Group</h4>

        <div class="input-group input-group-sm">

            <span class="input-group-text">
                Name
            </span>

            <input type="text"
                   class="form-control"
                   placeholder="Enter your name">

        </div>

    </div>

</body>

</html>
