<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Bootstrap Grid Demo</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

    <div class="container mt-4">

        <h2>Bootstrap Grid System</h2>

        <div class="row">

            <div class="col">
                <div class="p-3 border bg-light">
                    Column 1
                </div>
            </div>

            <div class="col">
                <div class="p-3 border bg-light">
                    Column 2
                </div>
            </div>

            <div class="col">
                <div class="p-3 border bg-light">
                    Column 3
                </div>
            </div>

        </div>


        <h3 class="mt-4">12 Column Grid</h3>

        <div class="row">

            <div class="col-4">
                <div class="p-3 border bg-light">
                    4 Columns
                </div>
            </div>

            <div class="col-4">
                <div class="p-3 border bg-light">
                    4 Columns
                </div>
            </div>

            <div class="col-4">
                <div class="p-3 border bg-light">
                    4 Columns
                </div>
            </div>

        </div>


        <h3 class="mt-4">Different Column Sizes</h3>

        <div class="row">

            <div class="col-3">
                <div class="p-3 border bg-light">
                    3
                </div>
            </div>

            <div class="col-6">
                <div class="p-3 border bg-light">
                    6
                </div>
            </div>

            <div class="col-3">
                <div class="p-3 border bg-light">
                    3
                </div>
            </div>

        </div>

    </div>

</body>

</html>
