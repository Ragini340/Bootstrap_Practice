<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Bootstrap Carousel Demo</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

    <div class="container mt-4">

        <h2>Bootstrap Carousel</h2>

        <!-- Carousel -->
        <div id="myCarousel"
             class="carousel slide"
             data-bs-ride="carousel">


            <!-- Indicators -->
            <div class="carousel-indicators">

                <button type="button"
                        data-bs-target="#myCarousel"
                        data-bs-slide-to="0"
                        class="active"
                        aria-current="true"
                        aria-label="Slide 1">
                </button>

                <button type="button"
                        data-bs-target="#myCarousel"
                        data-bs-slide-to="1"
                        aria-label="Slide 2">
                </button>

                <button type="button"
                        data-bs-target="#myCarousel"
                        data-bs-slide-to="2"
                        aria-label="Slide 3">
                </button>

            </div>


            <!-- Carousel Items -->
            <div class="carousel-inner">


                <!-- Slide 1 -->
                <div class="carousel-item active">

                    <img src="https://picsum.photos/id/1015/1000/400"
                         class="d-block w-100"
                         alt="Slide 1">

                    <div class="carousel-caption d-none d-md-block">

                        <h5>First Slide</h5>

                        <p>
                            Welcome to Bootstrap Carousel.
                        </p>

                    </div>

                </div>


                <!-- Slide 2 -->
                <div class="carousel-item">

                    <img src="https://picsum.photos/id/1016/1000/400"
                         class="d-block w-100"
                         alt="Slide 2">

                    <div class="carousel-caption d-none d-md-block">

                        <h5>Second Slide</h5>

                        <p>
                            Carousel can display multiple images.
                        </p>

                    </div>

                </div>


                <!-- Slide 3 -->
                <div class="carousel-item">

                    <img src="https://picsum.photos/id/1018/1000/400"
                         class="d-block w-100"
                         alt="Slide 3">

                    <div class="carousel-caption d-none d-md-block">

                        <h5>Third Slide</h5>

                        <p>
                            Users can navigate between slides.
                        </p>

                    </div>

                </div>

            </div>


            <!-- Previous Button -->
            <button class="carousel-control-prev"
                    type="button"
                    data-bs-target="#myCarousel"
                    data-bs-slide="prev">

                <span class="carousel-control-prev-icon"></span>

                <span class="visually-hidden">
                    Previous
                </span>

            </button>


            <!-- Next Button -->
            <button class="carousel-control-next"
                    type="button"
                    data-bs-target="#myCarousel"
                    data-bs-slide="next">

                <span class="carousel-control-next-icon"></span>

                <span class="visually-hidden">
                    Next
                </span>

            </button>

        </div>

    </div>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
