<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Bootstrap Image Demo</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

    <div class="container mt-4">

        <h2>Bootstrap Images</h2>


        <!-- Responsive Image -->
        <h4 class="mt-4">Responsive Image</h4>

        <img src="https://picsum.photos/600/300"
             class="img-fluid"
             alt="Responsive Image">


        <!-- Rounded Image -->
        <h4 class="mt-4">Rounded Image</h4>

        <img src="https://picsum.photos/300/200"
             class="rounded"
             alt="Rounded Image">


        <!-- Rounded Circle -->
        <h4 class="mt-4">Rounded Circle</h4>

        <img src="https://picsum.photos/200"
             class="rounded-circle"
             alt="Circle Image">


        <!-- Thumbnail Image -->
        <h4 class="mt-4">Thumbnail Image</h4>

        <img src="https://picsum.photos/300/200"
             class="img-thumbnail"
             alt="Thumbnail Image">


        <!-- Image With Border -->
        <h4 class="mt-4">Image With Border</h4>

        <img src="https://picsum.photos/300/200"
             class="img-fluid border border-primary rounded"
             alt="Bordered Image">

    </div>

</body>

</html>
