<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Bootstrap Toast Demo</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

    <div class="container mt-4">

        <h2>Bootstrap Toasts</h2>

        <p>
            Toasts are used to display short notification messages.
        </p>


        <!-- Button to Show Toast -->
        <button type="button"
                class="btn btn-primary"
                id="showToastButton">

            Show Toast

        </button>


        <!-- Toast Container -->
        <div class="toast-container position-fixed bottom-0 end-0 p-3">


            <!-- Toast -->
            <div id="myToast"
                 class="toast"
                 role="alert"
                 aria-live="assertive"
                 aria-atomic="true">

                <!-- Toast Header -->
                <div class="toast-header">

                    <strong class="me-auto">
                        Bootstrap Demo
                    </strong>

                    <small>
                        Just now
                    </small>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="toast"
                            aria-label="Close">
                    </button>

                </div>


                <!-- Toast Body -->
                <div class="toast-body">

                    Hello! This is a Bootstrap Toast notification.

                </div>

            </div>

        </div>


        <!-- Success Toast -->
        <h4 class="mt-5">
            Success Toast
        </h4>

        <button type="button"
                class="btn btn-success"
                id="successToastButton">

            Show Success

        </button>


        <div class="toast-container position-fixed top-0 end-0 p-3">

            <div id="successToast"
                 class="toast"
                 role="alert"
                 aria-live="assertive"
                 aria-atomic="true">

                <div class="toast-header">

                    <strong class="me-auto">
                        Success
                    </strong>

                    <small>
                        Just now
                    </small>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="toast"
                            aria-label="Close">
                    </button>

                </div>

                <div class="toast-body">

                    Your operation was completed successfully.

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Toast JavaScript -->
    <script>

        const showToastButton =
            document.getElementById("showToastButton");

        const myToastElement =
            document.getElementById("myToast");

        const myToast =
            bootstrap.Toast.getOrCreateInstance(myToastElement);


        showToastButton.addEventListener("click", function () {

            myToast.show();

        });


        const successToastButton =
            document.getElementById("successToastButton");

        const successToastElement =
            document.getElementById("successToast");

        const successToast =
            bootstrap.Toast.getOrCreateInstance(successToastElement);


        successToastButton.addEventListener("click", function () {

            successToast.show();

        });

    </script>

</body>

</html>
