<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Bootstrap Container Demo</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body>

    <!-- Fixed width responsive container -->
    <div class="container mt-4">

        <h2>Bootstrap Container</h2>

        <p>
            This content is inside a Bootstrap container.
        </p>

        <button class="btn btn-primary">
            Container Button
        </button>

    </div>


    <!-- Full width container -->
    <div class="container-fluid mt-4">

        <h2>Bootstrap Container Fluid</h2>

        <p>
            This content is inside a container-fluid.
            It uses the full available width of the screen.
        </p>

        <button class="btn btn-success">
            Fluid Container Button
        </button>

    </div>

</body>

</html>
